name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # builds first (pretest), then unit + e2e tests against a local HTTP server

  smoke:
    name: Smoke · real download over the internet
    needs: test
    runs-on: ubuntu-latest
    env:
      URL: https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci # `prepare` builds dist/
      - name: Run speedtest
        shell: bash # implies `set -o pipefail`, so a CLI failure fails the step despite `tee`
        run: |
          node dist/cli.js "$URL" | tee result.txt
          {
            echo '### Speed test from GitHub Actions runner'
            echo '```'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
